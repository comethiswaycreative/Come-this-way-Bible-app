<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ons Bybeltyd</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700;900&display=swap">
<style>
/* Layout: one storybook page per day — paper ground, watercolour brush labels, big readable lines for small readers */
:root{
  --paper:#FBF6EC; --card:#FFFDF8; --ink:#1E2A4A; --muted:#6E6656;
  --rose:#F4C3CF; --rose-soft:#FBE3E9; --leaf:#D6E8B2; --leaf-deep:#4F7A2E; --sun:#F2B53A; --line:#E9DFCB;
  --display:"Fraunces","Noto Serif TC",Georgia,"Times New Roman",serif;
  --body:"Andika","Noto Sans TC","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B1F30; --card:#242A3F; --ink:#F4EEE1; --muted:#B5AC9A;
  --rose:#7B3F57; --rose-soft:#3A2836; --leaf:#3D5A2A; --leaf-deep:#A9D27C; --sun:#F2C15A; --line:#353C55; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1F30; --card:#242A3F; --ink:#F4EEE1; --muted:#B5AC9A;
  --rose:#7B3F57; --rose-soft:#3A2836; --leaf:#3D5A2A; --leaf-deep:#A9D27C; --sun:#F2C15A; --line:#353C55; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--leaf-deep);outline-offset:3px}
a{color:inherit}

/* brush strokes */
.brush{display:inline-block;padding:.18em .55em .26em;background:var(--rose);
  border-radius:42% 58% 46% 54% / 62% 44% 56% 38%;box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--rose) 70%,var(--ink) 6%)}
.brush.green{background:var(--leaf);box-shadow:none;border-radius:38% 62% 55% 45% / 55% 45% 55% 45%}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{border:0;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:14px;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:lang(zh) .verse q{quotes:"「" "」"}
:lang(zh) .story{line-height:1.7}
.stars{font-weight:700;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stars b{color:var(--ink)}

/* home */
.hello{text-align:left;display:flex;flex-direction:column;gap:6px}
.hello h1{font-size:clamp(34px,8vw,48px)}
.hello p{margin:0;color:var(--muted)}
.today{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.blob{width:96px;height:96px;display:grid;place-items:center;font-size:52px;line-height:1;
  background:radial-gradient(circle at 35% 30%,var(--leaf),transparent 70%),radial-gradient(circle at 70% 75%,var(--rose),transparent 65%);
  border-radius:55% 45% 52% 48% / 48% 55% 45% 52%}
.today .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.today h2{font-size:26px;margin:4px 0 2px}
.today .ref{color:var(--muted);font-style:italic;font-size:15px}
.go{grid-column:1/-1;border:0;background:var(--ink);color:var(--paper);border-radius:16px;padding:14px 18px;font-size:20px;font-weight:700}
.progress{display:flex;flex-direction:column;gap:8px}
.track{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--leaf-deep);border-radius:99px;transition:width .4s}
.progress small{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}

/* list */
.section h2{font-size:26px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.tile .em{font-size:30px}
.tile .n{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tile .t{font-weight:700;font-size:15px;line-height:1.25}
.tile.done{background:color-mix(in srgb,var(--leaf) 40%,var(--card))}
.tile.done::after{content:"✓";position:absolute;top:10px;right:12px;font-weight:700;color:var(--leaf-deep)}
.tile.next{border-color:var(--leaf-deep);border-width:2.5px}

/* lesson */
.head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.head h1{font-size:clamp(30px,7.5vw,44px)}
.head .num{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.story{display:flex;flex-direction:column;gap:6px;font-size:21px;line-height:1.45}
.story p{margin:0}
.source{font-style:italic;color:var(--muted);font-size:16px;text-align:center;margin:0}
.verse{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.verse .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--leaf-deep);font-weight:700}
.verse q{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.3;quotes:"“" "”"}
.verse cite{font-style:normal;color:var(--muted);font-size:15px}
.do h2,.pray h2{font-size:30px;margin-bottom:6px}
.do-list{display:flex;flex-direction:column;gap:10px}
.act{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:transparent;border:1.5px dashed var(--line);border-radius:16px;padding:12px 14px}
.act .brush{font-family:var(--display);font-weight:800;font-size:20px;justify-self:start}
.act span.txt{grid-column:1;font-size:18px}
.act .tick{grid-row:1/3;grid-column:2;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:transparent}
.act[aria-pressed="true"]{border-style:solid;border-color:var(--leaf-deep)}
.act[aria-pressed="true"] .tick{background:var(--leaf-deep);border-color:var(--leaf-deep);color:var(--paper)}
.pray{background:var(--rose-soft);border-radius:28px 22px 30px 24px;padding:22px}
.pray p{margin:0;font-size:20px;line-height:1.5}
.nav{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.nav button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;font-weight:700;font-size:16px}
.nav button:disabled{opacity:.35;cursor:default}
.nav .finish{background:var(--ink);color:var(--paper);border-color:var(--ink);font-size:18px}
.nav .finish.is-done{background:var(--leaf-deep);border-color:var(--leaf-deep)}
.guide{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center}
.ava{width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 3px var(--leaf)}
.guide.cj .ava{box-shadow:0 0 0 3px var(--rose)}
.bubble{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;font-size:18px;line-height:1.4;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:22px;width:13px;height:13px;background:var(--card);border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.bubble b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf-deep)}
.guide.cj .bubble b{color:color-mix(in srgb,var(--rose) 45%,var(--ink))}
.hi{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:center}
.hi img{width:100%;border-radius:20px;display:block}
.hi p{margin:0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.3}
.do-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.do-head img{width:84px;height:84px;object-fit:cover;border-radius:22px 18px 24px 16px;flex:none}
.do-head h2{margin:0}
.pray{display:grid;grid-template-columns:minmax(0,170px) 1fr;gap:18px;align-items:center}
.pray img{width:100%;border-radius:18px;display:block}
@media (max-width:480px){.hi,.pray{grid-template-columns:1fr}.hi img,.pray img{max-width:260px}}
:root:lang(ja){--display:"Fraunces","Noto Serif JP",Georgia,serif;--body:"Andika","Noto Sans JP",system-ui,sans-serif}
:lang(ja) .verse q{quotes:"「" "」"}
:lang(ja) .story{line-height:1.7}
.craft{border:2px dashed var(--leaf-deep);border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--leaf) 22%,var(--card))}
.craft h2{font-size:30px}
.craft h3{font-size:22px;color:var(--leaf-deep)}
.craft .need{margin:0;font-size:17px}
.craft .need b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.craft ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.craft li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:18px;counter-increment:st}
.craft li::before{content:counter(st);width:34px;height:34px;border-radius:50%;background:var(--leaf-deep);color:var(--paper);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.dl{border:0;background:var(--ink);color:var(--paper);border-radius:14px;padding:13px 16px;font-size:17px;font-weight:700;align-self:flex-start}
.dl:disabled{opacity:.6}
.sheet-ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 70%,transparent);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-box{background:var(--card);border-radius:20px;padding:16px;max-width:560px;width:100%;max-height:100%;display:flex;flex-direction:column;gap:12px;overflow:auto}
.sheet-box img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff}
.sheet-pg{margin:0;display:flex;flex-direction:column;gap:8px}
.sheet-box p{margin:0;font-size:15px;color:var(--muted)}
.sheet-row{display:flex;gap:10px;flex-wrap:wrap}
.sheet-row a,.sheet-row button{flex:1;min-width:120px;text-align:center;border-radius:12px;padding:12px;font-weight:700;font-size:16px;text-decoration:none;border:1.5px solid var(--line);background:var(--card)}
.sheet-row .save{background:var(--leaf-deep);color:var(--paper);border-color:var(--leaf-deep)}
.mode button{font-size:14px}
.chooser{display:flex;flex-direction:column;gap:12px}
.chooser h2{font-size:24px}
.choose-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.choose{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.choose:hover{border-color:var(--leaf-deep)}
.choose .ce{font-size:36px}.choose b{font-family:var(--display);font-size:22px}.choose span:last-child{color:var(--muted);font-size:16px}
.settings{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.lvl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:15px}
.date-lbl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-weight:700;font-size:15px}
.date-lbl input{font:inherit;font-weight:400;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.hint{margin:0;color:var(--muted);font-size:14px}
.go-row{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.go-row .go{flex:1;min-width:160px;text-align:center;text-decoration:none}
.go.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.term h2{display:flex;flex-direction:column;gap:2px}
.term h2 small{font-family:var(--body);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf-deep)}
.weeks{display:flex;flex-direction:column;gap:6px}
.wk{display:grid;grid-template-columns:78px 34px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.wk:hover{border-color:var(--leaf-deep)}
.wk .wn{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.wk .em{font-size:24px}.wk .wt{font-weight:700;font-size:16px;min-width:0}
.wk .wd{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk.rv{background:var(--rose-soft)}
.tag{font-style:normal;font-size:12px;font-weight:700;background:var(--rose);border-radius:99px;padding:1px 8px;white-space:nowrap}
.tag.t2{background:var(--leaf)}
.big-present{width:100%;font-size:22px;padding:16px}
.tcard{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.tcard h2{font-size:24px;display:flex;align-items:baseline;gap:10px}.tcard h2 small{font-family:var(--body);font-size:15px;color:var(--muted)}
.tcard h3{font-size:19px;margin-top:4px;color:var(--leaf-deep)}
.plan{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:pl}
.plan li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;font-size:17px}
.plan .pm{font-weight:700;font-variant-numeric:tabular-nums;background:var(--leaf);border-radius:8px;padding:2px 8px;font-size:14px;white-space:nowrap}
.prep,.qs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:17px}
.qs li{font-weight:700}
.vg{margin:0;font-size:16px;color:var(--muted)}
.chal{margin:0;font-size:18px;background:var(--rose-soft);border-radius:14px;padding:10px 14px}
.tsub{font-size:26px;margin-top:6px}
.craft.wsheet{border-color:color-mix(in srgb,var(--rose) 70%,var(--ink));background:color-mix(in srgb,var(--rose-soft) 60%,var(--card))}
.craft.wsheet .need{font-size:19px}
.more{border-left:5px solid var(--leaf-deep);background:color-mix(in srgb,var(--leaf) 25%,var(--card));border-radius:0 16px 16px 0;padding:12px 16px;display:flex;flex-direction:column;gap:6px;font-size:18px}
.more b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf-deep)}.more p{margin:0}
.sl-big p{font-size:clamp(34px,6.4vw,96px)!important;text-align:center}
.sl-more p:not(.sl-kick){font-weight:600;color:var(--ink)}
.wb-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.dl.wb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;align-self:stretch}
.dl.wb small{font-weight:400;font-size:13px;opacity:.85}
.nav.tnav{grid-template-columns:1fr 1fr 1fr}
.nav.tnav>*{min-width:0}
a.navb{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;font-weight:700;font-size:16px;text-align:center;text-decoration:none;color:var(--ink)}
.grid a.tile{text-decoration:none;color:var(--ink)}
.pres{position:fixed;inset:0;z-index:30;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.pres-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:3vh 5vw;overflow:auto;cursor:pointer}
.slide{width:100%;max-width:1400px;animation:slin .35s ease-out}
@keyframes slin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
.pres-bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px 16px;border-top:1.5px solid var(--line);background:var(--card);flex-wrap:wrap}
.pres-bar button{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 18px;font-weight:700;font-size:16px}
.pres-bar .nx{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pres-bar button:disabled{opacity:.35}
.pc{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;min-width:70px;text-align:center}
.sl-title{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2vh}
.sl-title h1,.sl-do h1,.sl-craft h1{font-size:clamp(34px,6.5vw,96px)}
.sl-title p{margin:0;font-size:clamp(20px,3vw,40px);color:var(--muted)}
.sl-emoji{font-size:clamp(70px,14vw,200px);line-height:1}
.sl-pair{width:min(46vw,520px);border-radius:24px}
.sl-kick{margin:0;font-size:clamp(16px,2.2vw,30px);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--leaf-deep)!important}
.sl-q{font-family:var(--display);font-weight:600;color:var(--ink)!important;font-size:clamp(26px,4.4vw,64px)!important;line-height:1.25;text-wrap:balance}
.sl-guide{display:grid;grid-template-columns:auto 1fr;gap:3vw;align-items:center}
.sl-guide img{width:clamp(110px,20vw,280px);aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 0 0 8px var(--leaf)}
.sl-bubble{background:var(--card);border:2px solid var(--line);border-radius:32px;padding:3vh 3vw;font-size:clamp(26px,4.4vw,64px);line-height:1.3;font-family:var(--display);font-weight:600}
.sl-bubble b{display:block;font-family:var(--body);font-size:clamp(15px,1.8vw,26px);letter-spacing:.08em;text-transform:uppercase;color:var(--leaf-deep)}
.sl-story{display:flex;flex-direction:column;gap:3vh}
.sl-story p{margin:0;font-size:clamp(24px,3.8vw,60px);line-height:1.3;font-weight:700;text-wrap:pretty}
.sl-verse{background:var(--leaf);border-radius:40px;padding:5vh 5vw;display:flex;flex-direction:column;gap:2vh;text-align:center}
.sl-verse q{font-family:var(--display);font-weight:800;font-size:clamp(30px,5.4vw,84px);line-height:1.2;text-wrap:balance}
.sl-verse cite{font-style:normal;font-size:clamp(18px,2.6vw,36px);color:var(--muted)}
:lang(zh) .sl-verse q,:lang(ja) .sl-verse q{quotes:"「" "」"}
.sl-do{display:grid;grid-template-columns:minmax(0,38%) 1fr;gap:4vw;align-items:center}
.sl-do img{width:100%;border-radius:28px}
.sl-do p{margin:0;font-size:clamp(24px,4vw,58px);line-height:1.3}
.sl-do .sl-pray{font-family:var(--display);font-weight:600}
.sl-craft{display:flex;flex-direction:column;gap:2vh}
.sl-craft ol{margin:0;padding-left:1.2em;font-size:clamp(22px,3.4vw,50px);line-height:1.35;display:flex;flex-direction:column;gap:1.5vh}
@media (max-width:600px){.sl-do{grid-template-columns:1fr}.sl-do img{max-width:260px}.sl-guide{grid-template-columns:1fr;justify-items:center}.wk{grid-template-columns:62px 28px 1fr}.wk .wd{grid-column:3}}
.reset{align-self:center;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline}
.confirm{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:15px}
.confirm button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:15px}
.burst{position:fixed;left:50%;top:40%;font-size:72px;pointer-events:none;transform:translate(-50%,-50%) scale(.4);opacity:0}
.burst.on{animation:pop 1s ease-out}
@keyframes pop{30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
@media (prefers-reduced-motion:reduce){.burst.on{animation:none}.fill{transition:none}}
@media (max-width:420px){.today{grid-template-columns:1fr;justify-items:start}.blob{width:80px;height:80px;font-size:44px}.story{font-size:19px}.nav{grid-template-columns:1fr 1fr}.nav .finish{grid-column:1/-1;grid-row:1}}
</style>

<div class="wrap" id="app"></div>
<div class="burst" id="burst" aria-hidden="true">⭐</div>

<script id="data" type="text/plain">
# O|🌍|God maak die wêreld|Genesis 1–2
- In die begin was daar net donkerte en diep water.
- Op die eerste dag het God gesê: “Laat daar lig wees!” En daar was lig. Die lig het Hy dag genoem en die donker nag.
- Op die tweede dag het God die lug bo die waters gemaak.
- Op die derde dag het God die seë bymekaargemaak, en droë land het verskyn. Gras, blomme en vrugtebome het begin groei.
- Op die vierde dag het God die son, die maan en die sterre in die lug gesit.
- Op die vyfde dag het God die see vol visse gemaak en die lug vol voëls.
- Op die sesde dag het God al die diere gemaak. Toe het Hy die eerste man en vrou gemaak, om soos Hy te wees en vir sy wêreld te sorg.
- God het gekyk na alles wat Hy gemaak het, en dit was baie goed. Op die sewende dag het God gerus.
> In die begin het God die hemel en die aarde gemaak.|Genesis 1:1
* Die lig skyn|Maak jou hande oop en sprei jou vingers.
* Die see beweeg|Maak golwe met jou arms.
* God maak mense|Wys na jouself en dan na jou maatjies.
+ Liewe God, dankie vir U mooi wêreld. Dankie dat U my ook gemaak het!
# O|🍎|Adam en Eva in die tuin|Genesis 2–3
- God het 'n pragtige tuin geplant met die naam Eden, en Hy het Adam en Eva daar gesit om dit op te pas.
- Daar was baie bome met lekker vrugte, en hulle mag van almal geëet het, behalwe van een.
- God het gesê: “Moenie eet van die boom van die kennis van goed en kwaad nie.”
- Eendag het 'n slinkse slang vir Eva gesê: “Het God regtig so gesê? Julle sal nie doodgaan nie. Julle sal soos God wees!”
- Eva het van die vrug geëet en vir Adam ook gegee, en hy het ook geëet.
- Skielik was hulle skaam, en hulle het tussen die bome vir God weggekruip.
- Omdat hulle ongehoorsaam was, moes hulle die tuin verlaat.
- Maar God het hulle steeds liefgehad. Hy het vir hulle klere van diervelle gemaak, en Hy het belowe dat Iemand eendag die slang sal oorwin.
> As ons ons sondes bely, vergewe God ons.|1 Johannes 1:9
* Pluk 'n vrug|Strek hoog en pluk 'n vrug uit die boom.
* Luister mooi|Hou jou hand agter jou oor.
* Sê jammer|Druk jou hande teen jou hart en sê: “Jammer.”
+ Liewe God, help my om na U te luister. Dankie dat U my vergewe as ek jammer sê.
# O|🚢|Noag bou 'n ark|Genesis 6–7
- Baie jare later het die mense op aarde heeltyd slegte dinge gedoen, en God was baie hartseer.
- Maar Noag het God liefgehad en met Hom gelewe.
- God het gesê: “Bou 'n groot boot, 'n ark, van hout. Daar kom 'n vloed.”
- God het vir Noag presies gesê hoe lank, breed en hoog om dit te maak, met 'n deur in die kant en drie verdiepings binne-in.
- Noag het baie jare lank gekap en gesaag, en hy het alles gedoen net soos God vir hom gesê het.
- Toe het die diere twee-twee gekom, 'n mannetjie en 'n wyfie van elke soort, en Noag se familie het ook ingegaan.
- God self het die deur toegemaak.
- Toe het dit begin reën. Die water het hoër en hoër gestyg, maar God het almal in die ark veilig gehou.
> Noag het alles gedoen soos God vir hom gesê het.|Genesis 6:22
* Kap-kap|Maak of jy met 'n hamer slaan.
* Diere stap in|Stap soos 'n olifant, dan spring soos 'n kikker.
* Reëndruppels|Laat jou vingers van bo af na onder “reën”.
+ Liewe God, help my om te luister, al is dit moeilik. Dankie dat U my veilig hou.
# O|🌈|Die reënboog|Genesis 8–9
- Dit het veertig dae en veertig nagte gereën, totdat selfs die berge onder water was.
- Die ark het baie maande lank veilig op die water gedryf.
- Toe het God 'n wind gestuur, en die water het stadig gesak. Die ark het op die berge van Ararat gaan staan.
- Noag het 'n duif uitgestuur. Die eerste keer kon sy nêrens land nie, maar die volgende keer het sy met 'n vars olyfblaar teruggekom!
- Toe die grond droog was, het God gesê: “Kom uit die ark uit.”
- Noag, sy familie en al die diere het op die droë grond uitgeklim.
- Noag het 'n altaar gebou en God gedank.
- God het belowe om nooit weer die hele aarde te laat oorstroom nie, en Hy het 'n reënboog in die wolke gesit as teken van sy belofte.
> Ek sit my reënboog in die wolke as teken van my belofte.|Genesis 9:13
* Die duif vlieg|Klap jou arms soos vlerke.
* Die reënboog|Teken met jou arm 'n groot boog in die lug.
* Dankie sê|Vou jou hande en buig jou kop.
+ Liewe God, dankie dat U altyd U beloftes hou. Elke keer as ek 'n reënboog sien, dink ek aan U.
# O|⛺|Abraham vertrou God|Genesis 12
- Abram het saam met sy vrou Sarai en sy familie in die stad Haran gewoon.
- Eendag het God gesê: “Gaan weg uit jou land en jou pa se huis, na die land wat Ek jou sal wys.”
- God het belowe: “Ek sal van jou 'n groot nasie maak, en deur jou sal al die families op aarde geseën word.”
- Abram het nie geweet waarheen hy gaan nie, maar hy het God vertrou en gehoorsaam.
- Hy het sy tente, sy skape, sy bokke en sy kamele gepak.
- Abram, Sarai en sy nefie Lot het 'n lang, lang pad gestap tot in die land Kanaän.
- Daar het God gesê: “Ek sal hierdie land vir jou kinders gee.”
- Abram het 'n altaar gebou en God aanbid, wat hom die hele pad gelei het.
> Abraham het God geglo.|Genesis 15:6
* Pak jou tas|Maak of jy klere in 'n tas pak.
* Lang pad|Stap op die plek, al vinniger en vinniger.
* Ry 'n kameel|Wieg heen en weer soos op 'n kameel.
+ Liewe God, help my om U te vertrou, ook as ek nie weet wat gaan gebeur nie.
# O|✨|Sterre in die hemel|Genesis 15; 21
- Abram en Sarai was baie oud, en hulle het nog steeds nie kinders gehad nie.
- Een nag het God Abram buitentoe geneem en gesê: “Kyk op na die hemel en tel die sterre, as jy kan!”
- “So baie kinders en kleinkinders sal jy hê.”
- Abram het God geglo, en God was bly oor sy geloof.
- God het vir hulle nuwe name gegee: Abraham en Sara.
- Sara het gelag toe sy hoor sy sal op negentig jaar 'n baba kry. Maar niks is vir God te moeilik nie!
- Net soos God belowe het, het Sara 'n babaseuntjie gekry.
- Hulle het hom Isak genoem, en Sara het gesê: “God het my van blydskap laat lag!”
> Niks is te moeilik vir die Here nie.|Genesis 18:14
* Tel sterre|Wys na die lug en tel tot tien.
* Wieg die baba|Wieg 'n baba in jou arms.
* Lag saam|Lag hardop saam met Sara!
+ Liewe God, dankie dat niks vir U te moeilik is nie. U hou altyd U woord.
# O|🤝|Jakob en Esau|Genesis 25; 27; 33
- Isak en Rebekka het tweelingseuns gehad, Esau en Jakob. Esau is eerste gebore.
- Esau was 'n harige jagter wat lief was vir die veld, en Jakob was stil en het graag by die tente gebly.
- Eendag het Esau baie honger by die huis gekom, en hy het sy spesiale regte as oudste seun verruil vir 'n bord van Jakob se bredie.
- Later, toe hulle pa Isak oud en amper blind was, het Jakob voorgegee hy is Esau en hom gekul om hom die seën te gee.
- Esau was so kwaad dat Jakob weggevlug het na sy oom Laban, ver van die huis af.
- Jakob het twintig jaar daar gewoon. Hy het getrou en 'n groot familie gekry, en God was by hom.
- Toe Jakob uiteindelik huis toe gaan, was hy bang dat Esau nog kwaad is.
- Maar Esau het hom tegemoet gehardloop, hom gedruk en gesoen, en albei het gehuil. Die broers het vrede gemaak.
> Wees goed vir mekaar en vergewe mekaar.|Efesiërs 4:32
* Tweelinge|Staan rug aan rug met 'n maatjie.
* Weghardloop|Hardloop op die plek.
* 'n Groot drukkie|Gee iemand 'n drukkie.
+ Liewe God, help my om nie kwaad te bly nie. Leer my om te vergewe soos Esau.
# O|🧥|Josef se mooi kleed|Genesis 37
- Jakob het twaalf seuns gehad, en Josef was sy gunsteling.
- Jakob het vir Josef 'n pragtige kleed met baie kleure gegee, en sy broers het jaloers geword.
- Josef het twee drome gehad. In die een het sy broers se gerwe koring voor sy gerf gebuig. In die ander het die son, die maan en elf sterre voor hom gebuig.
- Toe Josef dit vir sy broers vertel, het hulle hom nog meer gehaat.
- Eendag het Jakob vir Josef gestuur om te kyk hoe dit met sy broers gaan, wat ver weg die skape opgepas het.
- Hulle het sy kleed gevat en hom in 'n leë put gegooi.
- Toe het hulle hom vir twintig silwerstukke verkoop aan handelaars wat op pad was na Egipte.
- Die broers het vir hulle pa gesê 'n wilde dier het Josef doodgemaak. Maar God was by Josef, selfs ver van die huis af.
> Die Here was by Josef.|Genesis 39:2
* Trek die kleed aan|Trek jou mooi kleed aan en draai in die rondte.
* Tel die broers|Tel tot twaalf op jou vingers.
* Ek is nie alleen nie|Druk jouself styf vas.
+ Liewe God, dankie dat U altyd by my is, ook as ek alleen of hartseer voel.
# O|🌾|Josef in Egipte|Genesis 39–41
- In Egipte het Josef vir 'n belangrike man met die naam Potifar gewerk. Josef het hard gewerk en was eerlik, en God het alles wat hy gedoen het, geseën.
- Maar Potifar se vrou het oor hom gelieg, en Josef is in die tronk gegooi.
- Selfs in die tronk was God by Josef, en die bewaarder het hom in beheer van die ander gevangenes gesit.
- Josef het die drome van twee gevangenes verklaar, die koning se skinker en die koning se bakker, en alles het gebeur net soos hy gesê het.
- Twee jaar later het die koning, Farao, 'n vreemde droom gehad: sewe vet koeie is deur sewe maer koeie opgeëet.
- Niemand kon dit verklaar nie, totdat die skinker aan Josef gedink het.
- Josef het gesê: “God sal vir u sê wat dit beteken. Daar kom sewe goeie jare, en dan sewe jare van hongersnood.”
- Farao het Josef in beheer van die hele Egipte gesit, om in die goeie jare kos op te gaar. Josef was nou die tweede belangrikste man in Egipte!
> God laat alles ten goede meewerk vir dié wat Hom liefhet.|Romeine 8:28
* Hard werk|Maak of jy swaar sakke koring dra.
* Slaap en droom|Lê jou kop op jou hande en snork.
* Koeie|Loei soos 'n koei: Moe-oe!
+ Liewe God, help my om eerlik en hardwerkend te wees, ook as dinge moeilik is.
# O|🫂|Josef vergewe sy broers|Genesis 42–45
- Die hongersnood het gekom, en daar was geen kos in Kanaän, waar Josef se familie gewoon het nie.
- Jakob het tien van sy seuns na Egipte gestuur om koring te koop.
- Hulle het voor Josef gebuig, net soos in sy droom, maar hulle het hom nie herken nie.
- Josef het geweet wie hulle is, maar hy het hulle getoets om te sien of hulle harte verander het.
- Toe sy broer Juda aanbied om 'n slaaf te word in die plek van die jongste broer, Benjamin, kon Josef nie meer sy trane keer nie.
- Hy het uitgeroep: “Ek is Josef, julle broer!”
- Die broers was bang, maar Josef het hulle vergewe. Hy het gesê: “Julle het kwaad bedoel, maar God het dit ten goede bedoel, om baie lewens te red.”
- Josef het sy pa en die hele familie na Egipte gebring om by hom te woon.
> Vergewe mekaar soos die Here julle vergewe het.|Kolossense 3:13
* Kos dra|Maak of jy 'n swaar sak op jou rug dra.
* Wie is ek?|Bedek jou gesig en wys dit dan: “Dis ek!”
* Vergewe|Skud iemand se hand en glimlag.
+ Liewe God, help my om ander te vergewe soos U my vergewe.
# O|🧺|Baba Moses in die mandjie|Eksodus 2
- Baie jare later het 'n nuwe koning in Egipte God se volk, die Israeliete, as slawe laat werk.
- Hy was bang daar is te veel van hulle, en hy het 'n wrede bevel gegee: elke Hebreeuse babaseuntjie moet in die Nylrivier gegooi word.
- 'n Ma met die naam Jogebed het haar babaseuntjie drie maande lank weggesteek.
- Toe sy hom nie langer kon wegsteek nie, het sy hom in 'n mandjie gesit wat met teer bestryk is, en dit tussen die riete by die rivier neergesit.
- Sy groot suster Mirjam het naby gestaan om te kyk wat gaan gebeur.
- Farao se dogter het na die rivier gekom om te bad. Sy het die mandjie gesien en jammer gekry vir die baba wat huil.
- Dapper Mirjam het gevra: “Moet ek 'n Hebreeuse vrou gaan soek om die baba vir u te versorg?” En sy het die baba se eie ma gaan haal!
- Toe die seuntjie groter was, het die prinses hom aangeneem en hom Moses genoem. God het hom veilig gehou.
> Die Here sal jou beskerm.|Psalm 121:7
* Wieg die mandjie|Wieg jou arms soos 'n mandjie op die water.
* Loer-loer|Maak 'n verkyker met jou hande en loer.
* Riete in die wind|Staan regop en swaai stadig heen en weer.
+ Liewe God, dankie dat U kinders veilig hou. Pas my familie op.
# O|🔥|Die brandende bos|Eksodus 3–4
- Toe Moses groot was, moes hy uit Egipte wegvlug. Hy het 'n herder in die woestyn geword.
- Eendag naby die berg Sinai het hy 'n bos gesien wat brand, maar dit het nie opgebrand nie!
- God het uit die bos geroep: “Moses! Moses! Trek jou skoene uit, want jy staan op heilige grond.”
- God het gesê: “Ek het gesien hoe my volk in Egipte swaarkry. Ek het hulle hoor huil.”
- “Gaan na Farao en lei my volk uit Egipte uit.”
- Moses was bang. “Wie is ek om dit te doen? En ek kan nie goed praat nie.”
- God het gesê: “Ek sal by jou wees. My Naam is EK IS WIE EK IS.”
- God het vir Moses sy broer Aäron gegee om hom te help, en Moses het teruggegaan Egipte toe.
> Ek sal by jou wees.|Eksodus 3:12
* Vlammetjies|Wikkel jou vingers hoog in die lug soos vlamme.
* Skoene uit|Maak of jy jou skoene uittrek.
* Hier is ek|Steek jou hand op en sê: “Hier is ek!”
+ Liewe God, as ek bang is, help my onthou dat U by my is.
# O|🐸|Laat my volk gaan|Eksodus 7–12
- Moses en Aäron het na Farao gegaan en gesê: “Die Here sê: Laat my volk gaan!”
- Maar Farao het gesê: “Wie is die Here? Ek sal hulle nie laat gaan nie!” En hy het die mense nog harder laat werk.
- Toe het God plae oor Egipte gestuur. Eers het die water van die Nylrivier bloed geword.
- Toe het paddas oral gespring, selfs in die beddens en die oonde! Toe het muskiete gekom, en vlieë, siek diere, swere, hael, sprinkane en donkerte.
- Elke keer het Farao weer “Nee!” gesê.
- Die tiende plaag was die ergste. God het vir sy volk gesê om lambloed aan hulle deurkosyne te smeer, sodat die dood by hulle huise sou verbygaan. Dit is die Pasga.
- Daardie nag het Farao uiteindelik gesê: “Gaan!”
- God se volk het Egipte verlaat, vry en bly, en die Egiptenare het hulle selfs goud en silwer gegee.
> Die Here is my krag en my lied.|Eksodus 15:2
* Paddas spring|Hurk en spring soos 'n padda.
* Hael val|Tik vinnig met jou vingers op jou bene.
* Vry!|Spring hoog op en juig!
+ Liewe God, dankie dat U sterk is en U kinders red.
# O|🌊|Deur die Rooi See|Eksodus 14
- God het sy volk bedags met 'n wolkkolom gelei en snags met 'n vuurkolom.
- Hulle het by die Rooi See gekom en kamp opgeslaan.
- Toe het Farao van plan verander, en hy het hulle agtervolg met sy soldate en seshonderd strydwaens.
- Die mense was doodbang. “Ons is vasgekeer!”
- Moses het gesê: “Moenie bang wees nie. Die Here sal vir julle veg.”
- Moses het sy staf oor die see uitgesteek, en God het die hele nag 'n sterk oostewind gestuur.
- Die see het oopgegaan, met 'n muur van water regs en links, en die mense het op droë grond deurgestap!
- Toe almal veilig oorkant was, het die water teruggekom, en Farao se leër was weg. Mirjam en die vroue het gedans en lofliedere vir God gesing.
> Die Here sal vir julle veg. Julle moet net stil wees.|Eksodus 14:14
* Steek die staf uit|Steek jou arm voor jou uit.
* Die see gaan oop|Sit jou hande saam en skuif hulle ver uitmekaar.
* Droë voete|Stap op jou tone tussen die mure water deur.
+ Liewe God, U is so sterk! Help my om U te vertrou as ek bang is.
# O|🍞|Manna uit die hemel|Eksodus 16
- In die woestyn was daar geen kos nie, en die mense het gekla: “In Egipte het ons meer kos gehad!”
- God het gesê: “Ek sal brood uit die hemel vir julle laat reën.”
- Daardie aand het baie voëls, kwartels, rondom die kamp geland, en daar was vleis om te eet.
- Die volgende oggend het dun wit vlokkies soos ryp op die grond gelê. Die mense het gevra: “Wat is dit?” Hulle het dit manna genoem.
- Dit het gesmaak soos koekies met heuning.
- Elke dag het elke familie net genoeg opgetel. As iemand ekstra gehou het, het dit wurms gekry en sleg geruik!
- Op die sesde dag het God dubbel gegee, sodat hulle op die sewende dag kon rus.
- Veertig jaar lank in die woestyn het God elke dag manna vir sy volk gegee.
> Gee ons vandag ons daaglikse brood.|Matteus 6:11
* Optel|Buk en tel manna op met albei hande.
* Proe|Vryf jou maag en sê: “Mmm!”
* Voëls vlieg|Fladder rond soos 'n kwartel.
+ Liewe God, dankie vir my kos elke dag. Help my om nie te kla nie.
# O|⛰️|Die Tien Gebooie|Eksodus 19–20
- Drie maande nadat hulle uit Egipte weg is, het God se volk by die berg Sinai kamp opgeslaan.
- Daar was donderweer, weerlig, 'n digte wolk en rook, en die hele berg het geskud.
- Moses het die berg uitgeklim om God te ontmoet.
- God het vir Moses tien gebooie gegee, op twee kliptafels geskryf:
- 1. Aanbid net vir My, die enigste ware God.
- 2. Moenie afgode maak of voor hulle buig nie.
- 3. Gebruik God se Naam met respek.
- 4. Hou die Sabbatdag heilig, as 'n rusdag.
- 5. Eer jou pa en jou ma.
- 6. Moenie moord pleeg nie.
- 7. Wees getrou in die huwelik.
- 8. Moenie steel nie.
- 9. Moenie oor ander lieg nie.
- 10. Moenie begeer wat aan iemand anders behoort nie.
- Die eerste gebooie leer ons om God lief te hê, en die ander leer ons om mense lief te hê. God het dit gegee omdat Hy vir ons omgee.
> Jy moet die Here jou God liefhê met jou hele hart.|Deuteronomium 6:5
* Klim die berg|Klim met jou arms en bene op die plek.
* Donderweer|Stamp met jou voete: boem-boem!
* Tel tot tien|Steek een vinger op vir elke gebod.
+ Liewe God, help my om U lief te hê en ander mense lief te hê.
# O|🍇|Die twaalf verkenners|Numeri 13–14
- God se volk het naby Kanaän gekom, die land wat God aan hulle belowe het.
- Moses het twaalf mans gestuur, een uit elke stam, om dit veertig dae lank te verken.
- Hulle het 'n land gevind wat “oorloop van melk en heuning”. Hulle het 'n tros druiwe teruggebring wat so groot was dat twee mans dit aan 'n paal moes dra!
- Maar tien van die verkenners het gesê: “Die stede het sterk mure, en die mense is reuse. Ons lyk soos sprinkane langs hulle!”
- Die mense was bang en het die hele nag gehuil. Hulle wou selfs teruggaan Egipte toe.
- Maar Josua en Kaleb het gesê: “Die land is baie goed. Moenie bang wees nie! Die Here is by ons.”
- Omdat die mense God nie vertrou het nie, moes hulle veertig jaar in die woestyn bly.
- Maar God was bly oor Josua en Kaleb, en Hy het belowe dat hulle die land sal ingaan.
> Wees sterk en moedig.|Josua 1:9
* Sluip|Sluip op jou tone en loer rond.
* Groot druiwe|Dra 'n swaar tros saam met 'n maatjie.
* Ek is moedig|Staan sterk met jou hande op jou heupe.
+ Liewe God, maak my moedig soos Josua en Kaleb. Saam met U kan ek!
# O|🎺|Die mure van Jerigo|Josua 6
- Nadat Moses dood is, het Josua die leier van God se volk geword.
- God het gesê: “Wees sterk en moedig, want Ek is by jou oral waar jy gaan.”
- Die eerste stad in die nuwe land was Jerigo, met hoë, dik mure en geslote poorte.
- God het vir Josua 'n vreemde plan gegee: “Stap ses dae lank een keer per dag om die stad. Laat die priesters die verbondsark dra en op hulle trompette blaas.”
- Op die sewende dag het hulle sewe keer om die stad gestap.
- Toe het die priesters 'n lang stoot op die ramshorings geblaas, en Josua het gesê: “Skree, want die Here het die stad aan julle gegee!”
- Al die mense het hard geskree, en die mure het platgeval!
- Ragab, wat die verkenners gehelp het, is saam met haar familie gered.
> Deur geloof het die mure van Jerigo geval.|Hebreërs 11:30
* Stap in 'n kring|Stap sewe keer om in 'n sirkel.
* Blaas die horing|Maak 'n horing met jou hande: toe-toe-toe!
* Die mure val|Skree hard en val saggies op die mat.
+ Liewe God, help my om U te gehoorsaam, al verstaan ek nie altyd hoekom nie.
# O|🔦|Gideon se klein leër|Rigters 6–7
- God se volk het God vergeet, en sewe jaar lank het die Midianiete gekom en al hulle oeste gesteel.
- Gideon het weggekruip terwyl hy koring dors, toe 'n engel sê: “Die Here is by jou, dapper held!”
- Gideon het gesê: “Maar ek is die onbelangrikste in my familie.”
- God het gesê: “Ek sal by jou wees.” Gideon het God met 'n skaapvel om tekens gevra, en God het dit geduldig gegee.
- Gideon het 32 000 soldate bymekaargemaak, maar God het gesê: “Te veel! Dan sal julle dink julle het self gewen.”
- Op die ou end het net 300 mans oorgebly.
- In die nag het elke man 'n trompet gevat en 'n kruik met 'n fakkel binne-in. Hulle het op die trompette geblaas, die kruike stukkend geslaan en geroep: “Vir die Here en vir Gideon!”
- Die vyand het so groot geskrik dat hulle weggehardloop het. God het die oorwinning gegee!
> God se krag word sterk in ons swakheid.|2 Korintiërs 12:9

* Fakkels|Hou jou fakkel hoog op.
* Breek die kruik|Klap jou hande hard saam!

# O|🌾|Rut en Naomi|Rut 1–4
- Naomi het in Moab gewoon met haar man en twee seuns, wat met Rut en Orpa getrou het.
- Ongelukkig het Naomi se man en albei haar seuns gesterf, en sy was baie hartseer.
- Naomi het besluit om terug te gaan huis toe, na Betlehem.
- Orpa het in Moab gebly, maar Rut het gesê: “Waar jy gaan, sal ek gaan. Jou volk is my volk, en jou God is my God.”
- In Betlehem was dit oestyd. Rut het oorblywende koring op die lande gaan optel, sodat hulle kos kon hê.
- Die land het aan Boas behoort, 'n goeie man uit Naomi se familie. Hy het vir sy werkers gesê om ekstra koring vir Rut te los.
- Later het Boas met Rut getrou, en hulle het 'n babaseuntjie met die naam Obed gekry.
- Obed het koning Dawid se oupa geword, en so het Rut deel van Jesus se familielyn geword.
> Waar jy gaan, sal ek gaan.|Rut 1:16

# O|🕯️|God roep Samuel|1 Samuel 3

# O|🐑|God kies Dawid|1 Samuel 16

- Toe Dawid inkom, het God gesê: “Hy is die een!”

- Zacchaeus wanted to see Jesus, but he was short and couldn't see over the crowd.
- So he ran ahead and climbed up a sycamore-fig tree.
- When Jesus got to the tree, He stopped, looked up and said, “Zacchaeus, come down quickly! I must stay at your house today.”
- Zacchaeus hurried down and welcomed Jesus with joy. But the people grumbled, “He's going to the house of a sinner!”
- Zacchaeus stood up and said, “Lord, I will give half of what I own to the poor. And if I cheated anyone, I will pay back four times as much!”
- Jesus said, “Today salvation has come to this house. I came to look for and save people who are lost.”
> Today salvation has come to this house.|Luke 19:9
* Short|Crouch small and peek between legs.
* Climb|Climb up the tree.
* Give back|Give with open hands.
+ Dear Jesus, thank You for coming to everyone. Help me to be honest.
# Bartimaeus Can See|Mark 10:46–52
- Jesus and His disciples were leaving the city of Jericho with a big crowd.
- A blind man named Bartimaeus was sitting by the road, begging.
- When he heard that Jesus was passing by, he shouted, “Jesus, Son of David, have mercy on me!”
- Many people told him to be quiet, but he shouted even louder: “Son of David, have mercy on me!”
- Jesus stopped and said, “Call him.” They said, “Cheer up! Get up, He's calling you!”
- Bartimaeus threw off his coat, jumped up and came to Jesus.
- Jesus asked, “What do you want Me to do for you?” He said, “Teacher, I want to see!”
- Jesus said, “Go, your faith has healed you.” Right away he could see, and he followed Jesus along the road.
> Call to Me and I will answer you.|Jeremiah 33:3
* Blind|Close your eyes and feel around.
* Call loudly|Cup your hands around your mouth: “Jesus!”
* I can see!|Open your eyes and look around.
+ Dear Jesus, You always hear me when I call. Thank You for listening.
# One Says Thank You|Luke 17:11–19
- Jesus was on His way to Jerusalem.
- As He went into a village, ten men with a terrible skin disease called leprosy came towards Him.
- Because of their sickness they had to stay away from other people. They stood far off and called out, “Jesus, Master, have mercy on us!”
- Jesus said, “Go and show yourselves to the priests.”
- On the way, they were healed! Their skin was clean.
- One of them, when he saw he was healed, came back, praising God in a loud voice.
- He threw himself at Jesus' feet and thanked Him. He was a Samaritan.
- Jesus asked, “Weren't all ten healed? Where are the other nine?” And He said to him, “Get up and go. Your faith has made you well.”
> Give thanks to the Lord, for He is good.|Psalm 136:1
* Count to ten|Count ten fingers.
* Run off|Run off happily.
* Come back|Come back and kneel: “Thank You, Jesus!”
+ Dear Jesus, I never want to forget to say thank you. Thank You for everything You give me.
# Lazarus Lives Again|John 11
- Lazarus and his sisters, Martha and Mary, were good friends of Jesus. They lived in Bethany.
- Lazarus became very sick, and his sisters sent Jesus a message: “Lord, the one You love is sick.”
- By the time Jesus arrived, Lazarus had died and had been in the tomb for four days.
- Martha said, “Lord, if You had been here, my brother would not have died.”
- Jesus said, “I am the resurrection and the life. Do you believe this?” Martha said, “Yes, Lord, I believe You are the Son of God.”
- Jesus saw Mary and their friends crying, and Jesus cried too.
- At the tomb Jesus said, “Take away the stone.” He prayed to His Father, and then He called out loudly, “Lazarus, come out!”
- And Lazarus came out, alive, still wrapped in strips of cloth! Many people who saw it believed in Jesus.
> I am the resurrection and the life.|John 11:25
* Sad|Wipe a tear from your cheek.
* Roll the stone|Push a heavy stone away.
* Come out!|Jump up from crouching.
+ Dear Jesus, You are stronger than death. Thank You for comforting me when I'm sad.
# Hosanna!|Matthew 21:1–11
- Jesus and His disciples came near to Jerusalem for the Passover festival.
- Jesus sent two disciples to a village to fetch a young donkey that no one had ever ridden.
- They put their cloaks on the donkey, and Jesus rode it into Jerusalem, just as the prophet Zechariah had said long before.
- A huge crowd came out to meet Him.
- Many spread their cloaks on the road, and others cut palm branches and waved them.
- They shouted, “Hosanna! Blessed is He who comes in the name of the Lord! Hosanna in the highest!”
- The whole city was stirred up and asked, “Who is this?”
- The crowds answered, “This is Jesus, the prophet from Nazareth.” It was like a parade for a king.
> Hosanna! Blessed is He who comes in the name of the Lord!|Matthew 21:9
* Donkey|Ride a donkey: hee-haw!
* Wave palms|Wave your arms from side to side.
* Hosanna!|Shout loudly: “Hosanna!”
+ Dear Jesus, You are my King. Hosanna!
# The Last Supper|Luke 22; John 13
- On the night of the Passover, Jesus ate a special meal with His twelve disciples in an upstairs room.
- During the meal Jesus got up, wrapped a towel around His waist and washed His disciples' feet, like a servant.
- He said, “I have given you an example. Serve each other, just as I have served you.”
- Then Jesus took bread, thanked God, broke it and said, “This is my body, given for you.”
- He took the cup and said, “This is my blood of the new covenant, poured out for the forgiveness of sins.”
- “Do this to remember Me.”
- Jesus also said, “Love each other as I have loved you.”
- After the meal they sang a song and went out to the garden of Gethsemane, where Jesus prayed.
> Love each other as I have loved you.|John 13:34
* Wash feet|Pretend to wash feet.
* Break bread|Break bread and share it.
* Remember|Put your hand on your heart.
+ Dear Jesus, help me to serve others, like You did.
# Jesus on the Cross|Luke 23
- In the garden of Gethsemane, soldiers came and arrested Jesus. Judas had betrayed Him.
- The leaders were angry with Jesus, and Pilate, the governor, let them crucify Him, even though He had done nothing wrong.
- The soldiers put a crown of thorns on His head and made fun of Him.
- They nailed Jesus to a wooden cross on a hill called Golgotha.
- Jesus prayed, “Father, forgive them, for they don't know what they are doing.”
- At midday darkness came over the whole land for three hours.
- Then Jesus called out, “It is finished!” and He died. He gave His life because He loves us, to take away our sins.
- His friends Joseph and Nicodemus laid His body in a new tomb, and a big stone was rolled in front of the entrance.
> No one has greater love than to give their life for their friends.|John 15:13
* A quiet moment|Sit very still and think about Jesus.
* Cross|Make a cross with your two fingers.
* Forgive|Whisper, “I forgive.”
+ Dear Jesus, thank You for dying for my sins. Thank You for Your great love.
# Jesus Is Alive!|Matthew 28; Luke 24
- Early on Sunday morning, Mary Magdalene and some other women went to the tomb with spices.
- On the way they wondered, “Who will roll the big stone away for us?”
- But when they got there, the stone had already been rolled away!
- The tomb was empty. Jesus' body was not there.
- An angel in shining clothes said, “Don't be afraid. Why are you looking for the living among the dead? He is not here. He has risen, just as He said!”
- The women ran to tell the disciples. Peter and John ran to the tomb and saw the empty grave clothes.
- Then Jesus Himself appeared to Mary Magdalene, and later to the disciples. He showed them His hands and His feet.
- Jesus is alive! He has beaten death!
> He is not here; He has risen!|Matthew 28:6
* Roll the stone|Roll your arms around each other.
* Empty!|Throw your hands open: nothing!
* He's alive!|Jump up and cheer: “Jesus is alive!”
+ Dear Jesus, You are alive! Thank You that one day I can be with You forever.
# Jesus Goes to Heaven|Acts 1
- After Jesus rose from the dead, He appeared to His friends many times over forty days.
- He taught them about God's kingdom.
- He said, “Wait in Jerusalem. In a few days you will be baptised with the Holy Spirit.”
- “You will receive power, and you will tell people about Me in Jerusalem and all the way to the ends of the earth.”
- Then, on the Mount of Olives, Jesus was taken up into heaven while they watched, and a cloud hid Him from sight.
- While they were still looking up, two men in white clothes stood beside them.
- They said, “Why are you looking at the sky? Jesus will come back in the same way you saw Him go.”
- The disciples went back to Jerusalem full of joy, and they prayed together every day.
> I am with you always, to the very end.|Matthew 28:20
* The whole world|Turn in a circle and point everywhere.
* Up high|Stretch your arms high and look up.
* Wave|Wave goodbye.
+ Dear Jesus, thank You for always being with me. Help me to tell others about You.
# Pentecost|Acts 2
- Fifty days after Passover, on the day of Pentecost, Jesus' followers were all together in one place.
- Suddenly a sound like a strong, rushing wind came from heaven and filled the whole house.
- They saw something like little flames of fire resting on each one of them.
- They were all filled with the Holy Spirit and began to speak in other languages.
- Jews from many countries were in Jerusalem, and each of them heard about God's wonders in their own language!
- Some people laughed and said, “They've had too much wine!”
- But Peter stood up and preached about Jesus: “God raised Jesus from the dead! Turn back to God and be baptised.”
- That day about 3,000 people believed in Jesus and were baptised.
> You will receive power when the Holy Spirit comes on you.|Acts 1:8
* Wind|Blow hard: whoosh!
* Little flames|Wiggle your fingers above your head.
* Other languages|Say “hello” in every language you know.
+ Dear God, fill me with Your Holy Spirit. Make me brave to tell others about Jesus.
# Saul Sees the Light|Acts 9
- Saul was very angry with people who believed in Jesus, and he put many of them in prison.
- He got letters from the high priest and set off for the city of Damascus to catch more of them.
- On the way, a bright light from heaven suddenly flashed around him, and he fell to the ground.
- A voice said, “Saul, Saul, why are you persecuting Me?” Saul asked, “Who are You, Lord?”
- “I am Jesus. Get up and go into the city, and you will be told what to do.”
- When Saul got up, he was blind. His friends led him by the hand into Damascus. For three days he didn't eat or drink, but he prayed.
- God sent a believer named Ananias. He put his hands on Saul and said, “The Lord Jesus has sent me, so that you can see again.” Something like scales fell from Saul's eyes, and he could see!
- Saul was baptised, and he became known as Paul. He travelled far and wide to tell everyone about Jesus.
> If anyone is in Christ, they are a new creation.|2 Corinthians 5:17
* Angry|Stomp your feet.
* Bright light|Cover your eyes and gently fall down.
* A new person|Jump up with a big smile.
+ Dear Jesus, thank You that You can change people. Make my heart new.
# Paul and Silas Sing|Acts 16:16–34
- Paul and Silas were telling people about Jesus in the city of Philippi.
- Some men got angry and dragged them to the leaders. They were beaten and thrown into prison.
- The jailer put them in the inner cell and locked their feet in wooden stocks.
- At midnight Paul and Silas were praying and singing songs to God, and the other prisoners were listening.
- Suddenly there was a big earthquake! All the doors flew open, and everyone's chains came loose.
- The jailer woke up and was terrified, because he thought the prisoners had escaped. But Paul shouted, “Don't hurt yourself! We're all here!”
- The jailer fell down before them and asked, “What must I do to be saved?” They said, “Believe in the Lord Jesus, and you will be saved, you and your family.”
- That same night the jailer washed their wounds, and he and his whole family were baptised. They were filled with joy.
> Always be joyful in the Lord.|Philippians 4:4
* Locked up|Keep your feet tight together.
* Sing|Sing your favourite song to God.
* Earthquake|Shake your whole body!
+ Dear God, help me to sing and be joyful, even when things are hard.
# Everything Made New|Revelation 21
- When John was very old, he was sent to an island called Patmos, because he had told people about Jesus.
- There God showed him a vision of what will happen at the end of time.
- John saw a new heaven and a new earth.
- He saw the holy city, the new Jerusalem, coming down from God, beautiful like a bride.
- The city shone with God's glory. It had twelve gates made of pearls and streets of pure gold.
- A loud voice said, “God will live with His people. He will wipe away every tear from their eyes.”
- “There will be no more death, or crying, or pain.”
- God, who sits on the throne, says, “Look, I am making everything new!”
> Look, I am making everything new!|Revelation 21:5
* Golden streets|Walk proudly on a golden street.
* Wipe tears|Wipe a tear from someone's cheek.
* All things new|Spin around and cheer.
+ Dear God, thank You for heaven. I can't wait for the day when everything is made new.

# 神創造世界|創世記 1–2
- 起初，只有黑暗和深深的水。
- 第一天，神說：「要有光！」就有了光。神稱光為晝，稱暗為夜。
- 第二天，神在水的上面造了天空。
- 第三天，神使海水聚在一處，旱地就露出來。青草、花朵和果樹開始生長。
- 第四天，神把太陽、月亮和星星放在天上。
- 第五天，神讓海裡充滿魚，天空充滿鳥。
- 第六天，神造了各樣的動物。然後祂造了第一個男人和女人，讓他們像祂，並且照顧祂的世界。
- 神看著祂所造的一切，都非常好。第七天，神安息了。
> 起初，神創造天地。|創世記 1:1
* 光照耀|張開雙手，伸開手指。
* 海浪動|用手臂做出波浪。
* 神造人|先指指自己，再指指朋友。
+ 親愛的天父，謝謝祢創造美麗的世界。謝謝祢也創造了我！
# 亞當和夏娃在園子裡|創世記 2–3
- 神栽了一個美麗的園子，叫做伊甸園，把亞當和夏娃放在那裡看守。
- 園子裡有很多結著好吃果子的樹，除了一棵以外，他們都可以吃。
- 神說：「不可吃分別善惡樹上的果子。」
- 有一天，一條狡猾的蛇對夏娃說：「神豈是真說的嗎？你們不一定死，你們會像神一樣！」
- 夏娃吃了果子，也給亞當，他也吃了。
- 他們突然覺得羞恥，就躲在樹林裡，不敢見神。
- 因為他們不聽話，他們必須離開園子。
- 但是神仍然愛他們。祂用獸皮為他們做衣服，又應許有一天會有一位打敗那條蛇。
> 我們若認自己的罪，神必赦免我們。|約翰一書 1:9
* 摘果子|把手伸高，從樹上摘一個果子。
* 好好聽|把手放在耳朵後面。
* 說對不起|雙手放在心上，說：「對不起。」
+ 親愛的天父，幫助我聽祢的話。謝謝祢在我說對不起的時候原諒我。
# 挪亞造方舟|創世記 6–7
- 過了許多年，地上的人常常做壞事，神非常難過。
- 但是挪亞愛神，與神同行。
- 神說：「用木頭造一艘大船，叫做方舟，因為洪水要來了。」
- 神告訴挪亞方舟要多長、多寬、多高，旁邊要開一扇門，裡面要有三層。
- 挪亞敲敲打打做了很多年，凡神吩咐他的，他都照樣做了。
- 動物們一對一對地來了，每一種都有一公一母，挪亞的家人也進了方舟。
- 神親自把門關上。
- 然後開始下雨，水越漲越高，但神保護方舟裡每一個都平安。
> 挪亞就照著神吩咐他的去做。|創世記 6:22
* 敲敲打打|假裝用鐵鎚敲釘子。
* 動物進方舟|像大象一樣踏步，再像青蛙一樣跳。
* 下雨了|讓手指從上面「下雨」到下面。
+ 親愛的天父，就算很難，也幫助我聽話。謝謝祢保護我平安。
# 彩虹|創世記 8–9
- 雨下了四十天四十夜，連高山都被淹沒了。
- 方舟在水上平安地漂了好幾個月。
- 後來神叫風吹過，水慢慢退了。方舟停在亞拉臘山上。
- 挪亞放出一隻鴿子。第一次牠找不到落腳的地方，下一次牠叼回一片新鮮的橄欖葉！
- 地乾了以後，神說：「你們出方舟吧。」
- 挪亞、他的家人和所有的動物都走到乾地上。
- 挪亞築了一座壇，感謝神。
- 神應許不再用洪水毀滅全地，祂把彩虹放在雲中，作為應許的記號。
> 我把虹放在雲彩中，作為我應許的記號。|創世記 9:13
* 鴿子飛|像翅膀一樣拍拍手臂。
* 彩虹|用手臂在空中畫一道大大的彩虹。
* 說謝謝|雙手合十，低下頭。
+ 親愛的天父，謝謝祢總是信守應許。每次看到彩虹，我都會想到祢。
# 亞伯拉罕信靠神|創世記 12
- 亞伯蘭和妻子撒萊，還有他的家人，住在哈蘭城。
- 有一天，神說：「你要離開本地、父家，往我所要指示你的地方去。」
- 神應許：「我必叫你成為大國，地上的萬族都要因你得福。」
- 亞伯蘭不知道要往哪裡去，但他信靠神，就聽從了。
- 他收拾好帳棚、綿羊、山羊和駱駝。
- 亞伯蘭、撒萊和他的姪子羅得，走了好遠好遠的路，來到迦南地。
- 在那裡，神說：「我要把這地賜給你的後裔。」
- 亞伯蘭築了一座壇敬拜神，因為神一路帶領他。
> 亞伯拉罕信神。|創世記 15:6
* 收行李|假裝把衣服放進包包裡。
* 好長的路|原地踏步，越走越快。
* 騎駱駝|像騎在駱駝上一樣左右搖擺。
+ 親愛的天父，就算我不知道會發生什麼事，也幫助我信靠祢。
# 天上的星星|創世記 15; 21
- 亞伯蘭和撒萊年紀很大了，還是沒有孩子。
- 有一天晚上，神帶亞伯蘭到外面，說：「你向天觀看，數算眾星，能數得過來嗎？」
- 「你的後裔將要像這樣多。」
- 亞伯蘭信神，神很喜悅他的信心。
- 神給他們取了新名字：亞伯拉罕和撒拉。
- 撒拉聽到自己九十歲還要生孩子，就笑了。但是在神沒有難成的事！
- 正如神所應許的，撒拉生了一個男孩。
- 他們給他取名叫以撒，撒拉說：「神使我喜樂歡笑！」
> 在耶和華豈有難成的事呢？|創世記 18:14
* 數星星|指著天空，從一數到十。
* 抱寶寶|在懷裡輕輕搖寶寶。
* 一起笑|和撒拉一起大聲笑！
+ 親愛的天父，謝謝祢沒有難成的事。祢總是信守祢的話。
# 雅各和以掃|創世記 25; 27; 33
- 以撒和利百加生了一對雙胞胎，以掃和雅各。以掃先出生。
- 以掃身上有很多毛，是個喜歡在田野打獵的人；雅各很安靜，喜歡住在帳棚裡。
- 有一天，以掃很餓地回家，竟然用長子的名分換了雅各的一碗湯。
- 後來，父親以撒年老、眼睛幾乎看不見，雅各假裝成以掃，騙父親把祝福給了他。
- 以掃非常生氣，雅各就逃到遠方舅舅拉班那裡。
- 雅各在那裡住了二十年，娶妻生子，有了大家庭，神一直與他同在。
- 後來雅各終於要回家，他很害怕以掃還在生氣。
- 但是以掃跑來迎接他，抱住他、親他，兩人都哭了。兄弟倆和好了。
> 要以恩慈相待，彼此饒恕。|以弗所書 4:32
* 雙胞胎|和朋友背靠背站著。
* 逃跑|原地跑步。
* 大大的擁抱|給一個人大大的擁抱。
+ 親愛的天父，幫助我不要一直生氣。教我像以掃一樣饒恕別人。
# 約瑟的彩衣|創世記 37
- 雅各有十二個兒子，他最疼愛約瑟。
- 雅各送給約瑟一件漂亮的彩衣，哥哥們就嫉妒他。
- 約瑟做了兩個夢。一個夢裡，哥哥們的麥捆向他的麥捆下拜；另一個夢裡，太陽、月亮和十一顆星星向他下拜。
- 約瑟把夢告訴哥哥們，他們就更恨他了。
- 有一天，雅各派約瑟去看看在遠處放羊的哥哥們。
- 他們剝下他的彩衣，把他丟進一個空坑裡。
- 然後他們用二十塊銀子把他賣給要去埃及的商人。
- 哥哥們對父親說，約瑟被野獸吃了。但就算離家很遠，神仍然與約瑟同在。
> 耶和華與約瑟同在。|創世記 39:2
* 穿彩衣|穿上漂亮的外衣，轉一圈。
* 數哥哥|用手指數到十二。
* 我不孤單|緊緊抱住自己。
+ 親愛的天父，謝謝祢一直與我同在，就算我覺得孤單或難過的時候也是。
# 約瑟在埃及|創世記 39–41
- 在埃及，約瑟為一位大官波提乏工作。約瑟工作認真又誠實，神使他所做的一切都順利。
- 但波提乏的妻子說謊陷害他，約瑟就被關進監牢。
- 在監牢裡神也與約瑟同在，獄長讓他管理其他的囚犯。
- 約瑟為兩個囚犯解夢，就是國王的酒政和膳長，事情都照他所說的發生了。
- 兩年後，國王法老做了一個奇怪的夢：七頭肥牛被七頭瘦牛吃掉了。
- 沒有人能解這個夢，直到酒政想起了約瑟。

# 耶穌在十字架上|路加福音 23
- 在客西馬尼園，士兵來抓走了耶穌。猶大出賣了祂。
- 領袖們很恨耶穌，雖然耶穌沒有做錯任何事，巡撫彼拉多還是讓他們把祂釘十字架。
- 士兵用荊棘編成冠冕戴在祂頭上，還戲弄祂。
- 他們在一座叫各各他的山上，把耶穌釘在木頭十字架上。
- 耶穌禱告說：「父啊，赦免他們，因為他們所做的，他們不曉得。」
- 中午的時候，遍地都黑暗了三個小時。
- 然後耶穌大聲說：「成了！」就斷了氣。祂捨了自己的生命，因為祂愛我們，要除去我們的罪。
- 祂的朋友約瑟和尼哥底母把祂的身體安放在一個新墳墓裡，又把一塊大石頭滾到墓口。
> 人為朋友捨命，人的愛心沒有比這個大的。|約翰福音 15:13

* 十字架|用兩根手指做一個十字架。

+ 親愛的耶穌，謝謝祢為我的罪死。謝謝祢偉大的愛。
# 耶穌復活了！|馬太福音 28; 路加福音 24
- 星期天一大早，抹大拉的馬利亞和幾個婦女帶著香料去墳墓。
- 路上她們說：「誰會替我們把那塊大石頭滾開呢？」
- 但到了那裡，石頭已經被滾開了！
- 墳墓是空的，耶穌的身體不在那裡。
- 一位穿著發光衣服的天使說：「不要害怕。為什麼在死人中找活人呢？祂不在這裡，祂已經復活了，正如祂所說的！」
- 婦女們跑去告訴門徒。彼得和約翰跑到墳墓，看見空空的細麻布。
- 後來耶穌親自向抹大拉的馬利亞顯現，又向門徒顯現。祂給他們看祂的手和腳。
- 耶穌活著！祂勝過了死亡！
> 祂不在這裡，照祂所說的，已經復活了！|馬太福音 28:6

+ 親愛的耶穌，祢活著！謝謝祢，有一天我可以永遠和祢在一起。
# 耶穌升天|使徒行傳 1
- 耶穌從死裡復活後，四十天之久多次向祂的朋友們顯現。
- 祂教導他們關於神國的事。
- 祂說：「你們要在耶路撒冷等候。不多幾日，你們要受聖靈的洗。」
- 「你們要得著能力，在耶路撒冷，直到地極，作我的見證。」
- 然後，在橄欖山上，他們正看的時候，耶穌被接上升，有一朵雲彩把祂接去，看不見了。
- 他們還在望天的時候，有兩個穿白衣的人站在旁邊。
- 他們說：「你們為什麼站著望天呢？這位耶穌，你們看見祂怎樣往天上去，祂還要怎樣來。」
- 門徒歡歡喜喜地回到耶路撒冷，每天一起禱告。
> 我就常與你們同在，直到世界的末了。|馬太福音 28:20

* 往上看|把手臂伸高，抬頭看。

# 五旬節|使徒行傳 2
- 逾越節後五十天，五旬節到了，跟隨耶穌的人都聚集在一處。
- 忽然，從天上有響聲下來，好像一陣大風吹過，充滿了整間房子。
- 他們看見好像火焰一樣的舌頭，落在每一個人頭上。
- 他們都被聖靈充滿，開始說別國的話。
- 從各國來的猶太人在耶路撒冷，每個人都聽見他們用自己的語言講說神的大作為！
- 有人譏笑說：「他們是喝醉了！」
- 但彼得站起來講論耶穌：「神已經叫耶穌從死裡復活了！你們要悔改，受洗。」
- 那一天，大約有三千人信了耶穌，受了洗。
> 聖靈降臨在你們身上，你們就必得著能力。|使徒行傳 1:8

* 小火焰|在頭上扭動手指。
* 別國的話|用你會的每一種語言說「你好」。
+ 親愛的天父，求祢用聖靈充滿我。讓我勇敢地告訴別人耶穌的事。
# 掃羅看見大光|使徒行傳 9
- 掃羅非常恨相信耶穌的人，把許多人關進監牢。
- 他向大祭司要了公文，往大馬色城去，要抓更多的人。
- 在路上，忽然有一道強光從天上四面照著他，他就倒在地上。
- 有聲音說：「掃羅！掃羅！你為什麼逼迫我？」掃羅問：「主啊，你是誰？」
- 「我就是耶穌。起來，進城去，你所當做的事，必有人告訴你。」
- 掃羅起來的時候，眼睛看不見了。朋友們拉著他的手，領他進大馬色。他三天不吃也不喝，只是禱告。
- 神派了一個叫亞拿尼亞的門徒去。他按手在掃羅身上說：「主耶穌打發我來，叫你能看見。」掃羅的眼睛上好像有鱗片掉下來，他就能看見了！
- 掃羅受了洗，後來大家叫他保羅。他走遍各地，把耶穌的事告訴每一個人。
> 若有人在基督裡，他就是新造的人。|哥林多後書 5:17
* 生氣|用力跺腳。
* 強光|遮住眼睛，輕輕倒下。
* 新的人|帶著大大的笑容跳起來。
+ 親愛的耶穌，謝謝祢能改變人。求祢讓我的心煥然一新。
# 保羅和西拉唱歌|使徒行傳 16:16–34
- 保羅和西拉在腓立比城向人傳講耶穌。
- 有些人很生氣，把他們拉到官長那裡。他們被打，又被丟進監牢。
- 獄卒把他們關在最裡面的牢房，兩腳上了木狗。
- 半夜，保羅和西拉禱告、唱詩讚美神，其他囚犯都側耳聽著。
- 忽然，地大震動！監門全開，所有人的鎖鏈都鬆開了。
- 獄卒醒來，非常害怕，以為囚犯都逃走了。但保羅大聲喊：「不要傷害自己！我們都在這裡！」
- 獄卒俯伏在他們面前，問：「我當怎樣行才可以得救？」他們說：「當信主耶穌，你和你一家都必得救。」
- 那天晚上，獄卒為他們洗傷，他和全家都受了洗，滿心歡喜。
> 你們要靠主常常喜樂。|腓立比書 4:4
* 鎖起來|把雙腳緊緊併攏。
* 唱歌|唱你最喜歡的歌給神聽。
* 地震|搖動你的全身！
+ 親愛的天父，就算事情很難，也幫助我唱歌、喜樂。
# 一切都更新了|啟示錄 21
- 約翰年紀很老的時候，因為傳講耶穌，被送到一個叫拔摩的海島上。

- 約翰看見一個新天新地。
- 他看見聖城新耶路撒冷從神那裡降下，好像打扮整齊的新娘。
- 這城有神的榮耀照耀，有十二個珍珠門，街道是純金的。
- 有大聲音說：「神要與祂的子民同住。祂要擦去他們一切的眼淚。」
- 「不再有死亡，也不再有悲哀、哭號、疼痛。」
- 坐在寶座上的神說：「看哪，我將一切都更新了！」
> 看哪，我將一切都更新了！|啟示錄 21:5

* 擦眼淚|幫別人擦掉臉上的眼淚。
* 一切更新|轉圈圈，大聲歡呼。

Friendship bracelet|Paper strip or wool, crayons, tape|Colour a paper strip with patterns.|Write your friend's name on it.|Tape it around your friend's wrist.
Crown of wisdom|Paper, crayons, stickers, scissors, tape|Cut a zigzag strip to make a crown.|Decorate it with jewels.|Write “Give me wisdom” on the front and wear it.
Paper plate raven|Paper plate, black crayon, scissors, glue|Colour the plate black and fold it in half as the body.|Cut out wings and a beak and glue them on.|Draw a piece of bread in its beak.
Altar on fire|Paper, crayons, red and yellow paper scraps, glue|Draw 12 stones in a pile.|Glue paper flames on top.|Write “The Lord is God!”
Seven dips|Paper, crayons, stickers|Draw Naaman with seven spots.|Count “one” to “seven” and cover one spot with a sticker each time.|Write “God heals.”
Queen Esther's crown|Paper, yellow crayon, stickers, scissors, tape|Cut out a crown and colour it gold.|Decorate it with jewel stickers.|Write “Be brave” on the front and wear it.
Brick wall|Paper, red crayon, scissors, glue|Cut lots of small rectangles as bricks.|Glue them in rows to build a wall.|Write the names of people who help you on the bricks.
Four in the fire|Paper, red, orange and yellow crayons|Draw a big furnace.|Draw four people walking around inside.|Colour flames all around, but not on the people!
Shut the lion's mouth|Printed template, crayons, scissors, 1 split pin|Colour the lion and its muzzle.|Cut out the lion and the muzzle.|Pin the muzzle on at the nose. Swing it down: the angel shuts the lion's mouth!
Jonah in the big fish|Printed template, crayons, scissors, 1 split pin|Colour the fish, Jonah and the jaw.|Cut out the fish and the jaw.|Push a split pin through the two dots to join them. Open and shut the mouth!
Paper plate angel|Paper plate, crayons, scissors, tape|Cut the plate into a body and two wings.|Draw a face on a small circle and stick it on top.|Write “Nothing is impossible with God.”
3D Bethlehem stable|Printed template, crayons, scissors, glue|Colour the stable, the roof and the figures.|Cut out the stable and fold the side walls forward so it stands. Fold the roof and glue it on top.|Cut out Mary, Joseph and baby Jesus in the manger, fold them so they stand, and put them in the stable.
Cotton-ball sheep|Paper, cotton balls, black crayon, glue|Draw a sheep shape.|Glue cotton balls on its body.|Add black legs and a face, and angels in the sky.
Star to follow|Yellow paper, scissors, string|Cut out a big star.|Write “We came to worship Him” on it.|Hang it on a string near a window.
Growing chart|Long strip of paper, crayons, tape|Tape the strip to the wall.|Mark how tall you are and write the date.|Write “I grow in wisdom” at the top.
Handprint dove|White paper, crayon, scissors|Trace your hand: the thumb is the head and the fingers are the wings.|Cut it out and draw an eye.|Write “God loves me.”
Net full of fish|Paper, crayons, scissors, glue|Draw a net with criss-cross lines.|Cut out small fish and glue them in the net.|Write the names of friends you can tell about Jesus.
Six jars|Paper, crayons|Draw six jars in a row.|Colour the bottoms blue and the tops purple.|Count them and say, “Do what He tells you.”
3D house with a hole in the roof|Printed template, crayons, scissors, glue, string|Colour the house and the man on his mat.|Cut out the house, cut the roof flap on the solid lines, fold the walls down on the dashed lines and glue the grey tabs.|Tie string to the mat, open the roof and lower the man down to Jesus!
3D boat in the storm|Printed template, crayons, scissors, glue|Colour the boat, the waves, Jesus and the disciples.|Cut out the boat, fold up the sides and glue the grey tabs. Fold the waves like a zigzag so they stand around the boat.|Put sleeping Jesus and the disciples in the boat. Rock it in the storm, then make the sea calm!
Five loaves, two fish|Paper, crayons, scissors, glue|Draw a basket.|Cut out 5 bread rolls and 2 fish and glue them in.|Count them: 5 and 2!
Peter on the waves|Paper, blue crayon|Draw blue waves at the bottom.|Draw Jesus holding out His hand.|Draw Peter reaching up to Jesus.
Plaster for a friend|Paper, plaster or tape, crayons|Draw a person who is hurt.|Stick a plaster on them.|Write “I can help.”
Find the lost sheep|Printed template, crayons, scissors, glue|Colour the hills, the sheep, the shepherd and the bushes.|Cut out the three bushes and the shepherd.|Glue each bush only by its grey tab, one over the lost sheep. Lift the bushes to find it!
Welcome-home arms|Long strip of paper, crayons, scissors|Trace your two hands at the ends of the strip.|Draw the dad's happy face in the middle.|Fold the arms around: a welcome hug!
Handprint heart|Paper, paint or crayons|Trace your hand.|Draw a heart in the palm.|Write “Jesus loves me.”
Zacchaeus climbs the tree|Printed template, crayons, scissors|Colour the tree, Jesus and Zacchaeus.|Cut out Zacchaeus on his strip, and ask a grown-up to cut the thick line in the trunk.|Push the strip through the slit from the back and slide Zacchaeus up and down!
I can see glasses|Paper, crayons, scissors|Draw a big pair of glasses and cut them out.|Cut out the eye holes.|Look through them and say, “I can see!”
Thank-you card|Paper, crayons|Fold the paper into a card.|Draw ten people and colour the one who said thank you.|Write a thank-you note and give it to someone.
Tomb with a rolling stone|Paper, grey paper circle, tape|Draw a tomb with a dark door.|Cut a grey circle as the stone and tape it on one side.|Roll the stone away: “Lazarus, come out!”
Palm branch|Green paper, scissors, tape, a stick or straw|Trace your hand many times on green paper.|Cut them out and tape them along a stick.|Wave it and shout, “Hosanna!”
Bread and cup|Paper, crayons|Draw a long table with bread and a cup.|Draw Jesus and His friends around it.|Write “Love each other.”
Heart on the cross|Paper, brown and red crayons, scissors|Cut out a cross shape and colour it brown.|Draw a big red heart in the middle.|Write “Jesus loves me so much.”
3D empty tomb|Printed template, crayons, scissors, 1 split pin|Colour the tomb, the stone, the angel and the women.|Cut out the tomb and fold it on the dashed line so it stands. Cut out the round door. Pin the stone next to the door.|Roll the stone away, stand up the angel and the women, and shout: “He is risen!”
Jesus and the cloud|Paper, cotton balls, crayons, glue|Draw Jesus with His arms up.|Glue cotton-ball clouds around Him.|Write “I am with you always.”
Wind streamer|Paper strip, red, orange and yellow paper strips, tape|Make a ring from the paper strip.|Tape colourful strips hanging down.|Run with it and watch the wind blow!
Two-face plate|Paper plate, crayons|Draw an angry face on one side.|Draw a happy, new face on the other side.|Flip it while you tell Saul's story.
Praise shaker|Two paper cups, rice or beans, tape|Put a little rice in one cup.|Tape the second cup on top.|Shake it while you sing to God!
City of gold|Paper, yellow crayon, stickers|Draw a city with golden streets.|Decorate it with jewels and bright colours.|Write “Everything new!”
</script>
<script id="craft-af" type="text/plain">
Skeppingswiel|Gedrukte patroon, kryte, skêr, 1 splitpen|Kleur albei wiele in.|Knip albei wiele uit, en knip die grys venster in die boonste wiel uit.|Sit die boonste wiel op die onderste en druk 'n splitpen deur die middel. Draai dit en kyk na dag 1 tot 6!
Vrugteboom met 'n hart|Papier, kryte, rooi papier, gom|Teken 'n groot boom met 'n bruin stam en groen blare.|Skeur rooi papier in klein vruggies en plak dit op.|Teken 'n hartjie op een vrug: God het ons steeds lief.
3D-ark van Noag|Gedrukte patroon, kryte, skêr, gom|Kleur die ark, die dak en die diere in.|Knip die ark uit, vou die kante op die stippellyne op en plak die grys strokies vas. Vou die dak en sit dit bo-op.|Knip die diere uit, vou hulle op die stippellyn sodat hulle staan, en sit hulle twee-twee in die ark!
Watteball-reënboog|Papier, kryte, watteballetjies, gom|Teken 'n groot boog in al die reënboogkleure.|Plak watteballetjies aan albei kante as wolke.|Skryf: “God hou sy beloftes.”
Abraham se 3D-tent|Gedrukte patroon, kryte, skêr|Kleur die tent, Abraham en die diere in.|Knip die tent uit en vou dit op die stippellyn sodat dit soos 'n regte tent staan. Knip die deur sodat dit oopgaan.|Knip Abraham, die skape en die ster uit, vou hulle sodat hulle staan, en slaan jou kamp op!
Tel-die-sterre-lug|Donker papier, wit kryt of bordkryt, sterplakkers|Maak die papier vol sterre.|Tel hulle saam.|Teken baba Isak onder op die blad.
Papierdrukkie|Lang strook papier, kryte, skêr|Trek albei jou hande aan die twee punte van die strook af.|Teken jou gesig in die middel en knip die hande uit.|Vou die arms om iemand en sê: “Ek vergewe jou.”
Kleurvolle kleed|Papier, kryte of stukkies gekleurde papier, gom|Teken 'n eenvoudige kleed.|Kleur elke streep 'n ander kleur, of plak stukkies papier op.|Skryf: “God is by my.”
Vet koeie, maer koeie|Papier, kryte|Vou die papier dubbel.|Teken 7 vet koeie aan die een kant en 7 maer koeie aan die ander kant.|Tel hulle hardop en teken sakke koring onderaan.
Vergewe-handjie|Papier, kryte, skêr|Trek jou hand af en knip dit uit.|Skryf “Ek vergewe jou” op die palm.|Gee dit vir iemand in jou familie.
Baba Moses se 3D-mandjie|Gedrukte patroon, kryte, skêr, gom|Kleur die mandjie, die rivier, baba Moses en die riete in.|Knip die mandjie uit, vou die kante op die stippellyne op en plak die grys strokies vas.|Sit baba Moses in die mandjie, laat die riete staan, en laat dit op die rivier dryf!
Handafdruk-brandende bos|Papier, rooi, oranje, geel en groen kryte|Teken 'n groen bos.|Trek jou hande bo die bos af en kleur hulle soos vlamme.|Skryf: “Ek sal by jou wees.”
Papierbord-padda|Papierbord, groen kryt, rooi strokie papier, gom|Kleur die bord groen en vou dit dubbel.|Plak 'n lang rooi tong binne-in.|Teken twee groot oë bo-op. Kwaak!
Die see gaan oop|Gedrukte patroon, kryte, skêr|Kleur die pad, die mense en die mure van water in.|Knip om die buitelyn en vou die twee kantdeure op die stippellyne na binne.|Kleur die buitekant van die deure blou soos die see. Maak oop: die see gaan oop!
Manna in die woestyn|Papier, watteballetjies of geskeurde wit papier, gom|Teken tente en sand onder op die blad.|Plak wit “manna” oral op die grond.|Skryf: “God gee my my daaglikse brood.”
Kliptafels|Grys papier of karton, kryte, skêr|Knip twee tafels met ronde bokante uit.|Skryf die getalle 1 tot 10 daarop.|Skryf “Het God lief” op die een en “Het ander lief” op die ander.
Reusedruiwe|Papier, pers verf of kryt|Teken 'n lang stok oor die blad.|Maak baie pers vingerafdrukke as 'n groot tros druiwe.|Teken Josua en Kaleb wat dit dra.
Die 3D-mure van Jerigo|Gedrukte patroon, kryte, skêr, gom|Kleur die toring, die muur en die mense in.|Knip die toring uit, vou op die stippellyne en plak die grys strokie vas om 'n vierkantige toring te maak. Vou die muur soos 'n sigsag sodat dit staan.|Laat die mense staan, stap sewe keer om, en stamp dan die mure om!
Fakkel en kruik|Papier, rooi, oranje en geel kryte, skêr, gom|Teken 'n kleikruik.|Knip papiervlamme uit en plak hulle sodat hulle uit die kruik kom.|Skryf: “God maak my sterk.”
Bondel koring|Geel papier, skêr, kleeflint of tou|Knip baie dun geel strokies.|Bondel hulle saam en bind hulle in die middel vas.|Gee jou bondel vir 'n vriend.
Luisteroor-kopband|Strook papier, kryte, skêr, kleeflint|Maak 'n band wat om jou kop pas.|Teken en knip twee groot ore uit en plak hulle aan die kante.|Dra dit en sê: “Praat, Here, ek luister.”
God sien my hart|Papier, rooi kryt, foelie (opsioneel)|Teken 'n groot hart.|Teken jouself daarin, of plak foelie op soos 'n spieël.|Skryf: “God kyk na my hart.”
Vyf gladde klippies|Papier, grys kryt, skêr (of regte klippies)|Teken en knip vyf klippies uit, of gebruik regte klippies.|Skryf een woord op elkeen: God / is / altyd / by / my.|Bêre hulle in 'n koevert of sakkie.
Vriendskapsarmband|Strook papier of wol, kryte, kleeflint|Kleur 'n strook papier met patrone.|Skryf jou vriend se naam daarop.|Plak dit om jou vriend se pols.
Kroon van wysheid|Papier, kryte, plakkers, skêr, kleeflint|Knip 'n strook met punte om 'n kroon te maak.|Versier dit met juwele.|Skryf voorop “Gee my wysheid” en dra dit.
Papierbord-kraai|Papierbord, swart kryt, skêr, gom|Kleur die bord swart en vou dit dubbel as die lyf.|Knip vlerke en 'n bek uit en plak dit op.|Teken 'n stukkie brood in sy bek.
Altaar aan die brand|Papier, kryte, stukkies rooi en geel papier, gom|Teken 12 klippe op 'n hoop.|Plak papiervlamme bo-op.|Skryf: “Die Here is God!”
Sewe keer onder|Papier, kryte, plakkers|Teken Naäman met sewe kolle.|Tel van een tot sewe en plak elke keer 'n plakker oor 'n kol.|Skryf: “God maak gesond.”
Koningin Ester se kroon|Papier, geel kryt, plakkers, skêr, kleeflint|Knip 'n kroon uit en kleur dit goud.|Versier dit met juweelplakkers.|Skryf voorop “Wees dapper” en dra dit.
Baksteenmuur|Papier, rooi kryt, skêr, gom|Knip baie klein reghoekies as bakstene.|Plak hulle in rye om 'n muur te bou.|Skryf die name van mense wat jou help op die bakstene.
Vier in die vuur|Papier, rooi, oranje en geel kryte|Teken 'n groot oond.|Teken vier mense wat binne-in rondstap.|Kleur vlamme oral, maar nie op die mense nie!
Maak die leeu se bek toe|Gedrukte patroon, kryte, skêr, 1 splitpen|Kleur die leeu en sy snoet in.|Knip die leeu en die snoet uit.|Steek die snoet met die splitpen by die neus vas. Swaai dit af: die engel maak die leeu se bek toe!
Jona in die groot vis|Gedrukte patroon, kryte, skêr, 1 splitpen|Kleur die vis, Jona en die kakebeen in.|Knip die vis en die kakebeen uit.|Druk 'n splitpen deur die twee kolletjies om hulle vas te maak. Maak die bek oop en toe!
Papierbord-engel|Papierbord, kryte, skêr, kleeflint|Knip die bord in 'n lyf en twee vlerke.|Teken 'n gesiggie op 'n klein sirkel en plak dit bo-op.|Skryf: “Niks is vir God onmoontlik nie.”
3D-stal van Betlehem|Gedrukte patroon, kryte, skêr, gom|Kleur die stal, die dak en die figure in.|Knip die stal uit en vou die symure vorentoe sodat dit staan. Vou die dak en plak dit bo-op.|Knip Maria, Josef en baba Jesus in die krip uit, vou hulle sodat hulle staan, en sit hulle in die stal.
Watteball-skapie|Papier, watteballetjies, swart kryt, gom|Teken 'n skaap.|Plak watteballetjies op sy lyf.|Teken swart pootjies en 'n gesiggie, en engele in die lug.
Ster om te volg|Geel papier, skêr, tou|Knip 'n groot ster uit.|Skryf daarop: “Ons het gekom om Hom te aanbid.”|Hang dit aan 'n tou by 'n venster.
Groeikaart|Lang strook papier, kryte, kleeflint|Plak die strook teen die muur.|Merk hoe lank jy is en skryf die datum.|Skryf bo: “Ek groei in wysheid.”
Handafdruk-duif|Wit papier, kryt, skêr|Trek jou hand af: die duim is die kop en die vingers is die vlerke.|Knip dit uit en teken 'n ogie.|Skryf: “God het my lief.”
Net vol visse|Papier, kryte, skêr, gom|Teken 'n net met kruis-en-dwars lyne.|Knip klein vissies uit en plak hulle in die net.|Skryf die name van vriende vir wie jy van Jesus kan vertel.
Ses kanne|Papier, kryte|Teken ses kanne in 'n ry.|Kleur die onderkant blou en die bokant pers.|Tel hulle en sê: “Doen wat Hy sê.”
3D-huis met 'n gat in die dak|Gedrukte patroon, kryte, skêr, gom, tou|Kleur die huis en die man op sy matras in.|Knip die huis uit, knip die dakflap op die soliede lyne, vou die mure op die stippellyne af en plak die grys strokies vas.|Bind tou aan die matras, maak die dak oop en laat die man na Jesus toe sak!
3D-boot in die storm|Gedrukte patroon, kryte, skêr, gom|Kleur die boot, die golwe, Jesus en die dissipels in.|Knip die boot uit, vou die kante op en plak die grys strokies vas. Vou die golwe soos 'n sigsag sodat hulle om die boot staan.|Sit die slapende Jesus en die dissipels in die boot. Wieg dit in die storm, en maak dan die see stil!
Vyf brode, twee visse|Papier, kryte, skêr, gom|Teken 'n mandjie.|Knip 5 broodjies en 2 vissies uit en plak hulle in.|Tel hulle: 5 en 2!
Petrus op die golwe|Papier, blou kryt|Teken blou golwe onder op die blad.|Teken Jesus wat sy hand uitsteek.|Teken Petrus wat na Jesus reik.
Pleister vir 'n vriend|Papier, pleister of kleeflint, kryte|Teken iemand wat seergekry het.|Plak 'n pleister op hulle.|Skryf: “Ek kan help.”
Soek die verlore skaap|Gedrukte patroon, kryte, skêr, gom|Kleur die heuwels, die skape, die herder en die bosse in.|Knip die drie bosse en die herder uit.|Plak elke bos net aan sy grys strokie vas, een oor die verlore skaap. Lig die bosse op en soek!
Welkom-tuis-arms|Lang strook papier, kryte, skêr|Trek jou twee hande aan die punte van die strook af.|Teken die pa se bly gesig in die middel.|Vou die arms om: 'n welkom-drukkie!
Handafdruk-hart|Papier, verf of kryte|Trek jou hand af.|Teken 'n hart in die palm.|Skryf: “Jesus het my lief.”
Saggeus klim in die boom|Gedrukte patroon, kryte, skêr|Kleur die boom, Jesus en Saggeus in.|Knip Saggeus op sy strokie uit, en vra 'n grootmens om die dik lyn in die stam oop te sny.|Steek die strokie van agter deur die gleuf en skuif Saggeus op en af!
Ek-kan-sien-bril|Papier, kryte, skêr|Teken 'n groot bril en knip dit uit.|Knip die oog-gate uit.|Kyk daardeur en sê: “Ek kan sien!”
Dankie-kaartjie|Papier, kryte|Vou die papier in 'n kaartjie.|Teken tien mense en kleur die een in wat dankie gesê het.|Skryf 'n dankie-briefie en gee dit vir iemand.
Graf met 'n rolklip|Papier, grys papiersirkel, kleeflint|Teken 'n graf met 'n donker deur.|Knip 'n grys sirkel as die klip en plak dit aan een kant vas.|Rol die klip weg: “Lasarus, kom uit!”
Palmtak|Groen papier, skêr, kleeflint, stokkie of strooitjie|Trek jou hand baie keer op groen papier af.|Knip hulle uit en plak hulle langs 'n stokkie.|Swaai dit en roep: “Hosanna!”
Brood en beker|Papier, kryte|Teken 'n lang tafel met brood en 'n beker.|Teken Jesus en sy vriende rondom die tafel.|Skryf: “Het mekaar lief.”
Hart op die kruis|Papier, bruin en rooi kryte, skêr|Knip 'n kruis uit en kleur dit bruin.|Teken 'n groot rooi hart in die middel.|Skryf: “Jesus het my so lief.”
3D-leë graf|Gedrukte patroon, kryte, skêr, 1 splitpen|Kleur die graf, die klip, die engel en die vroue in.|Knip die graf uit en vou dit op die stippellyn sodat dit staan. Knip die ronde deur uit. Steek die klip met die splitpen langs die deur vas.|Rol die klip weg, laat die engel en die vroue staan, en roep: “Hy het opgestaan!”
Jesus en die wolk|Papier, watteballetjies, kryte, gom|Teken Jesus met sy arms omhoog.|Plak watteball-wolke rondom Hom.|Skryf: “Ek is altyd by julle.”
Windlinte|Strook papier, rooi, oranje en geel strokies papier, kleeflint|Maak 'n ring van die strook papier.|Plak kleurvolle strokies wat afhang.|Hardloop daarmee en kyk hoe waai die wind!
Twee-gesig-bord|Papierbord, kryte|Teken 'n kwaai gesig aan die een kant.|Teken 'n bly, nuwe gesig aan die ander kant.|Draai dit om terwyl jy Saulus se storie vertel.
Lofskudder|Twee papierbekers, rys of bone, kleeflint|Gooi 'n bietjie rys in een beker.|Plak die tweede beker bo-op vas.|Skud dit terwyl jy vir God sing!
Stad van goud|Papier, geel kryt, plakkers|Teken 'n stad met goue strate.|Versier dit met juwele en helder kleure.|Skryf: “Alles word nuut!”
</script>

創造轉盤|列印的模板、蠟筆、剪刀、1 個雙腳釘|把兩個轉盤塗上顏色。|剪下兩個轉盤，再把上面轉盤的灰色窗口剪掉。|把上面的轉盤疊在下面那個上，用雙腳釘穿過中間。轉一轉，看看第 1 到第 6 天！
有愛心的果樹|紙、蠟筆、紅色紙、膠水|畫一棵大樹，有咖啡色的樹幹和綠色的葉子。|把紅色紙撕成小果子，貼上去。|在一個果子上畫愛心：神還是愛我們。
立體挪亞方舟|列印的模板、蠟筆、剪刀、膠水|為方舟、屋頂和動物塗上顏色。|剪下方舟，沿虛線把四邊摺起來，黏好灰色的小條。把屋頂摺好放在上面。|剪下動物，沿虛線對摺讓牠們站起來，一對一對放進方舟！
棉花球彩虹|紙、蠟筆、棉花球、膠水|用彩虹的每一個顏色畫一道大大的拱形。|在兩端貼上棉花球當作雲。|寫上：「神信守祂的應許。」
亞伯拉罕的立體帳棚|列印的模板、蠟筆、剪刀|為帳棚、亞伯拉罕和動物塗上顏色。|剪下帳棚，沿虛線對摺，讓它像真的帳棚一樣站起來。剪開門，讓門可以打開。|剪下亞伯拉罕、羊和星星，摺好讓他們站起來，搭好你的營地！
數星星的夜空|深色紙、白色蠟筆或粉筆、星星貼紙|在紙上畫滿星星，越多越好。|大家一起數一數。|在下面畫小嬰兒以撒。
紙抱抱|長紙條、蠟筆、剪刀|在紙條兩端描出你的兩隻手。|在中間畫你的臉，再把手剪下來。|用紙手臂抱住一個人，說：「我原諒你。」
